# @package _global_

# to execute this experiment run:
# python train.py experiment=latent_kitti_vio_mvformer

defaults:
  - override /data: latent_dino_kitti_vio
  - override /model: latent_vio_mvformer
  - override /callbacks: default
  - override /trainer: default

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

tags: ["latent_kitti_vio", "weighted", "Manifold", "transformer"]

seed: 42

trainer:
  min_epochs: 20
  max_epochs: 200
  log_every_n_steps: 1

data:
  batch_size: 64

model:
  _target_: src.models.weighted_vio_module.WeightedVIOLitModule

  optimizer:
    lr: 0.0001

  criterion:
    _target_: src.metrics.weighted_loss.AngleWeightedPoseLoss
    base_loss_fn:
      _target_: torch.nn.L1Loss
      reduction: none
    angle_weight: 10
  
  scheduler:
    T_0: 25
    T_mult: 1

  tester:
    seq_len: 11
    use_history_in_eval: True




